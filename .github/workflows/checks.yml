name: Thesis checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  fast-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10.20'
          cache: pip
          cache-dependency-path: requirements-thesis.txt
      - name: Install CPU dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --index-url https://download.pytorch.org/whl/cpu torch==2.11.0
          sed '/^torch==/d' requirements-thesis.txt > /tmp/requirements-cpu.txt
          python -m pip install -r /tmp/requirements-cpu.txt
          python -m pip install --no-deps -e '.[thesis]'
          python -m pip check
      - name: Check imports without model downloads
        run: |
          python -c 'import auto_circuit.tasks, auto_circuit.prune_algos.prune_algos, experiments.pipeline, hpo.search_spaces'
          bash -n scripts/thesis.sh scripts/slurm/thesis_job.sh scripts/setup_environment.sh
      - name: Fast artifact, configuration and launcher tests
        run: |
          python -m pytest --noconftest -q tests/test_thesis_launcher.py tests/test_thesis_pipeline.py tests/test_thesis_configuration.py tests/test_final_artifacts.py
