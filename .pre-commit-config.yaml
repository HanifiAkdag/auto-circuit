# Local hooks are static checks. Compute-node tests and artifact verification
# run separately through scripts/thesis.sh and CI.
exclude: ^(artifacts/final/|datasets/|poetry\.lock|\.prune_scores_cache[^/]*/)
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.3.0
    hooks:
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-added-large-files
        args: ['--maxkb=2000']
        # Explicit scientific data exceptions; hashes are verified separately.
        exclude: ^(artifacts/final/|datasets/evaluation/)
      - id: end-of-file-fixer
      - id: check-json
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.0.280
    hooks:
      - id: ruff
        types_or: [python, pyi]
        # Lint only: immutable data and source are not reformatted by hooks.
        args: [--select, F]
